name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          ACDF53: ${{ secrets.ACDF53 }}
          B692F5: ${{ secrets.B692F5 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('ACDF53', '')
          env_b = os.environ.get('B692F5', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 4c0adb6f6d8eb9c2af58cf3dd02f5f53cf25ea91 -->', env_a)
          if env_b:
              result = result.replace('<!-- 34c447e303f4ef00b3c1eeb57300 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
